name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[all]"

      - name: Run test suite
        run: |
          pytest -v

      - name: Verify package exports
        run: |
          python -c "import traffic_prediction; print('traffic_prediction version:', getattr(traffic_prediction, '__version__', '0.1.0'))"

      - name: Verify data graph directory
        run: |
          python -c "from scripts.verify_data import check_graph_files; assert check_graph_files()"
