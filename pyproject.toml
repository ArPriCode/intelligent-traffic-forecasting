[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-prediction"
version = "0.1.0"
description = "Reusable traffic-speed forecasting components"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
]
gat = ["torch>=2.0"]
web = ["streamlit>=1.35"]
viz = ["matplotlib>=3.8"]
test = [
    "pytest>=8.0",
]
all = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "torch>=2.0",
    "streamlit>=1.35",
    "matplotlib>=3.8",
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pandas.errors.Pandas4Warning",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
